[package]
name = "MATSim_pt_viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = {version = "0.16.1", features = ["bevy_dev_tools", "dynamic_linking"]}
bevy_egui = { version = "0.36.0", features = ["immutable_ctx"] }
chrono = "0.4.42"
proj = "0.31.0"
quick-xml = { version = "0.38.3", features = ["serialize"] }
walkers = "0.45.0"


[profile.dev]
opt-level = 3
